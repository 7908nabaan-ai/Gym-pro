name: Import Gym source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gym-Pro
        uses: actions/checkout@v4

      - name: Import Gym source
        run: |
          git clone --depth 1 https://github.com/7908nabaan-ai/Gym.git /tmp/gym-source
          rsync -a --delete --exclude '.git' --exclude '.github' /tmp/gym-source/ ./

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Gym application source" || true
          git push origin main
