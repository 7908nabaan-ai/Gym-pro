          progress = root / 'src/utils/progressEngine.ts'
          progress.write_text('''import { ProgressLogEntry } from "../types";
export interface ProgressTrend { weeks: number; averageWeeklyWeightChangeKg: number; averageCalories: number | null; recommendation: "increase" | "maintain" | "decrease" | "insufficient-data"; calorieAdjustment: number; }
export function analyzeProgress(logs: ProgressLogEntry[], goal: string): ProgressTrend {
  const sorted = [...logs].filter(l => Number.isFinite(l.weightKg)).sort((a,b) => a.date.localeCompare(b.date));
  if (sorted.length < 3) return { weeks: 0, averageWeeklyWeightChangeKg: 0, averageCalories: null, recommendation: "insufficient-data", calorieAdjustment: 0 };
  const first = sorted[0], last = sorted[sorted.length - 1];
  const days = Math.max(1, (Date.parse(last.date) - Date.parse(first.date)) / 86400000);
  const weeklyChange = ((last.weightKg - first.weightKg) / days) * 7;
  const calories = sorted.map(x => x.caloriesConsumed).filter((x): x is number => Number.isFinite(x));
  let recommendation: ProgressTrend["recommendation"] = "maintain";
  let adjustment = 0;
  if (/bulk/i.test(goal) && weeklyChange < 0.1) { recommendation = "increase"; adjustment = 100; }
  else if (/bulk/i.test(goal) && weeklyChange > 0.4) { recommendation = "decrease"; adjustment = -100; }
  else if (/cut/i.test(goal) && weeklyChange > -0.15) { recommendation = "decrease"; adjustment = -100; }
  else if (/cut/i.test(goal) && weeklyChange < -0.8) { recommendation = "increase"; adjustment = 100; }
  return { weeks: days / 7, averageWeeklyWeightChangeKg: Math.round(weeklyChange * 100) / 100, averageCalories: calories.length ? Math.round(calories.reduce((a,b) => a+b, 0) / calories.length) : null, recommendation, calorieAdjustment: adjustment };
}
''')

          workout = root / 'src/utils/workoutProgression.ts'
          workout.write_text('''export interface SetPerformance { weightKg: number; reps: number; rir?: number; }
export interface ProgressionDecision { nextWeightKg: number; targetReps: number; reason: string; }
export function recommendNextLoad(last: SetPerformance, repMin: number, repMax: number, incrementKg = 2.5): ProgressionDecision {
  const rir = last.rir ?? 2;
  if (last.reps >= repMax && rir >= 2) return { nextWeightKg: Math.round((last.weightKg + incrementKg) * 10) / 10, targetReps: repMin, reason: "Top of rep range reached with adequate reps in reserve." };
  if (last.rir && last.rir <= 0 && last.reps < repMax) return { nextWeightKg: last.weightKg, targetReps: Math.min(repMax, last.reps + 1), reason: "Keep load stable while fatigue is high." };
  return { nextWeightKg: last.weightKg, targetReps: Math.min(repMax, Math.max(repMin, last.reps + 1)), reason: "Add a rep before adding load." };
}
''')

