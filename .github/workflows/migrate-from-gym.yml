          calc = root / 'src/utils/calculations.ts'
          c = calc.read_text()
          old = re.search(r'export function calculateMuscleGrowthVelocity\([\s\S]*?\n}\n\nexport function calculateComprehensiveMetrics', c)
          if old:
              new = '''export function calculateMuscleGrowthVelocity(
  experienceLevel: string,
  weightKg: number,
  _trainingYears: number
): {
  monthlyRatePercent: number;
  monthlyGainKg: number;
  annualGainKg: number;
  monthlyRangeKg: [number, number];
  annualRangeKg: [number, number];
} {
  const ranges: Record<string, [number, number]> = {
    novice: [0.75, 1.25], intermediate: [0.50, 0.75], advanced: [0.25, 0.50], elite: [0.10, 0.25],
  };
  const [lowPct, highPct] = ranges[experienceLevel] || ranges.intermediate;
  const midpoint = (lowPct + highPct) / 2;
  const monthlyRangeKg: [number, number] = [
    Math.round(weightKg * lowPct / 100 * 100) / 100,
    Math.round(weightKg * highPct / 100 * 100) / 100,
  ];
  const monthlyGainKg = Math.round(weightKg * midpoint / 100 * 100) / 100;
  const annualRangeKg: [number, number] = [
    Math.round(monthlyRangeKg[0] * 12 * 10) / 10,
    Math.round(monthlyRangeKg[1] * 12 * 10) / 10,
  ];
  return { monthlyRatePercent: midpoint, monthlyGainKg, annualGainKg: Math.round(monthlyGainKg * 12 * 10) / 10, monthlyRangeKg, annualRangeKg };
}

export function calculateComprehensiveMetrics'''
              c = c[:old.start()] + new + c[old.end():]
